<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota SP | Escapadas de fim de semana</title>
    <meta name="description" content="[uma frase sua sobre o site]">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Ícone na aba do navegador (favicon) -->    
    <link rel="icon" href="imagens/faviconfinal.ico" >

    <!-- Google Fonts ok -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="estilos/normal.css">
    <link rel="stylesheet" href="estilos/telas-pequenas.css" media="(max-width: 767px)">
    <link rel="stylesheet" href="estilos/telas-grandes.css" media="(min-width: 768px)">

    <!-- Script específico da Página Inicial -->
    <script src="scripts/inicio.js" defer></script>

</head>

<body>
    <header>
        <div class="cabecalho">
            <a class="marca" href="index.html">
                <img src="imagens/images1.ico" alt="" >
                Rota SP
            </a>            
            
            <!-- Botão Menu Projeto Final Telas Pequenas-->
            
            <button id="botao-menu" 
                aria-label="Abrir 
                menu de navegação" 
                aria-expanded="false" 
                aria-controls="menu-principal">
                ☰
            </button>

            <nav id="menu-principal" aria-label="Menu principal">
                <a href="index.html" class="ativo" arial-current="page">Início</a>
                <a href="destinos.html">Destinos</a>
                <a href="contato.html">Contato</a>
            </nav>
        </div>    
    </header>

    <main>
        <section class="hero">
            <img src="imagens/hero.webp" alt="[descreva a imagem]" width="1200" height="600">
        </section>

        <section class="filtro">
            <h2>Escolha sua próxima viagem</h2>
            <form action="destinos.html">
                <label for="tipo">Tipo de programa</label>
                <select id="tipo" name="tipo">
                    <option value="">Todos</option>
                    <option value="natureza">Natureza</option>
                    <option value="historia">História</option>
                    <option value="gastronomia">Gastronomia</option>
                </select>
                <!-- repita label + select para os outros campos do seu wireframe -->
                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="destaques">
            <h2>Roteiros em destaque</h2>
            <div class="cartoes">
                <article class="cartao">
                    <img src="imagens/destino1.webp" alt="[descreva]" width="400" height="300" loading="lazy">
                    <h3>[Nome do destino]</h3>
                    <p>[distância] · [tempo de viagem]</p>
                    <p>[custo estimado]</p>
                    <a href="destinos.html">Ver detalhes</a>
                </article>
                <!-- repita o <article> para os outros roteiros -->
            </div>
        </section>
    </main>

    <footer>
        <p>[texto do rodapé]</p>
        <nav aria-label="Redes sociais">
            <a href="#" aria-label="[nome da rede]">[ícone]</a>
        </nav>
    </footer>
</body>

</html>
